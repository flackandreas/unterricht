services:
  web:
    build: .
    ports:
      - "8889:80"
    volumes:
      - ./src:/var/www/html
    environment:
      # Achtung, andersherum als lange angenommen: was hier steht, gewinnt
      # ueber src/.env. Dotenv wird immutable geladen und ueberschreibt keine
      # Variable, die in der Umgebung schon gesetzt ist. Einstellungen, die
      # je Installation abweichen duerfen (TRUSTED_PROXIES, PORTAL_*), gehoeren
      # deshalb in src/.env und nicht hierher - sonst lassen sie sich dort
      # nicht mehr aendern.
      TZ: Europe/Berlin
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/login.php') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Arbeitet die KI-Auswertungen ab. Ohne diesen Dienst bleiben Abgaben in
  # der Warteschlange stehen - sie gehen nicht verloren, werden aber auch
  # nicht ausgewertet.
  worker:
    build: .
    command: php /var/www/html/bin/worker.php
    volumes:
      - ./src:/var/www/html
    environment:
      TZ: Europe/Berlin
    networks:
      - app-network
    depends_on:
      - web
    restart: unless-stopped

networks:
  app-network:
    # Dasselbe Netz, an dem Portal, Antragssystem und die Datenbank haengen.
    #
    # Compose benennt Netze nach dem Projektverzeichnis - auf dem Pi hiess das
    # des Antragssystems "feedback_rstn", daher der Name. Auf einem anderen
    # Rechner kann er anders lauten, und dann startet dieser Stapel nicht:
    # "network feedback_rstn_app-network declared as external, but could not
    # be found". Was "docker network ls" dort ausgibt, traegt MODULNETZ nach -
    # dieselbe Variable, die pi/compose.pi.yml im Portal-Repo schon verwendet,
    # und sie kommt aus derselben pi/.env.
    #
    # Ohne MODULNETZ bleibt es beim bisherigen Namen; am Pi aendert sich also
    # nichts.
    name: ${MODULNETZ:-feedback_rstn_app-network}
    external: true
